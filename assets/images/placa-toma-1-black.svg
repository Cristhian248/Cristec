<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <filter id="plate-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
    <linearGradient id="plate-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f3630"/>
      <stop offset="100%" stop-color="#1c221d"/>
    </linearGradient>
    <linearGradient id="plate-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262d27"/>
      <stop offset="100%" stop-color="#1e241f"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8d6d27"/>
      <stop offset="50%" stop-color="#dcb158"/>
      <stop offset="100%" stop-color="#8d6d27"/>
    </linearGradient>
  </defs>

  <!-- Placa 4x2 cuerpo principal -->
  <rect x="6" y="6" width="188" height="308" rx="16" fill="url(#plate-bevel)" filter="url(#plate-shadow)" stroke="#3d473e" stroke-width="1.2"/>
  <rect x="10" y="10" width="180" height="300" rx="12" fill="url(#plate-face)"/>

  <!-- Chasis / marco porta-módulos interior 4x2 -->
  <rect x="22" y="20" width="156" height="280" rx="7" fill="#181e19" stroke="#2b332c" stroke-width="1"/>

  <g>
    <rect x="28" y="28" width="144" height="82" rx="5" fill="#1a201b" stroke="#283129" stroke-width="1" opacity="0.9"/>
    <line x1="38" y1="69" x2="162" y2="69" stroke="#2d372e" stroke-width="1" opacity="0.6"/>
  </g>
  <g>
    <rect x="28" y="119" width="144" height="82" rx="5" fill="#242b25" stroke="#353e36" stroke-width="1.2"/>
    <rect x="34" y="125" width="132" height="70" rx="8" fill="#1f2520" stroke="#2f3830" stroke-width="0.8"/>
    <!-- Ranura Izquierda (Universal: plana vertical + redonda centro) -->
    <g transform="translate(69, 154)">
      <path d="M-3,-15 h6 v6.5 c3,1.8 4.8,4.8 4.8,8.5 c0,3.7 -1.8,6.7 -4.8,8.5 v6.5 h-6 v-5.5 c-3.8,-1.6 -6.5,-5.2 -6.5,-9.5 c0,-4.3 2.7,-7.9 6.5,-9.5 z" fill="#070a07"/>
      <rect x="-1.5" y="-13" width="2" height="26" fill="url(#brass)" opacity="0.75"/>
      <circle cx="-1.5" cy="0" r="3.5" fill="url(#brass)" opacity="0.85"/>
    </g>
    <!-- Ranura Derecha (Universal: plana vertical + redonda centro) -->
    <g transform="translate(131, 154)">
      <path d="M-3,-15 h6 v5.5 c3.8,1.6 6.5,5.2 6.5,9.5 c0,4.3 -2.7,7.9 -6.5,9.5 v5.5 h-6 v-6.5 c-3,-1.8 -4.8,-4.8 -4.8,-8.5 c0,-3.7 1.8,-6.7 4.8,-8.5 z" fill="#070a07"/>
      <rect x="-0.5" y="-13" width="2" height="26" fill="url(#brass)" opacity="0.75"/>
      <circle cx="1.5" cy="0" r="3.5" fill="url(#brass)" opacity="0.85"/>
    </g>
    <!-- Puesta a tierra (Arco / U estándar) -->
    <g transform="translate(100, 179)">
      <path d="M-5,-5.5 c0,-3.2 2.2,-5.5 5,-5.5 c2.8,0 5,2.3 5,5.5 v5.5 c0,1.2 -1,2.2 -2.2,2.2 h-5.6 c-1.2,0 -2.2,-1 -2.2,-2.2 z" fill="#070a07"/>
      <circle cx="0" cy="-2.5" r="2.8" fill="url(#brass)" opacity="0.7"/>
    </g>
    <text x="100" y="137" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="600" fill="#556356" letter-spacing="1">16A 250V~</text>
  </g>
  <g>
    <rect x="28" y="210" width="144" height="82" rx="5" fill="#1a201b" stroke="#283129" stroke-width="1" opacity="0.9"/>
    <line x1="38" y1="251" x2="162" y2="251" stroke="#2d372e" stroke-width="1" opacity="0.6"/>
  </g>
</svg>