<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <filter id="plate-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="rgba(0,0,0,0.14)"/>
    </filter>
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6dad2"/>
    </linearGradient>
  </defs>

  <!-- Placa exterior 4x2 arquitectónica -->
  <rect x="10" y="10" width="180" height="300" rx="18" fill="url(#plate-grad)" filter="url(#plate-shadow)" stroke="#cfd4cb" stroke-width="1"/>
  <!-- Cara frontal de la placa con relieve suave -->
  <rect x="14" y="14" width="172" height="292" rx="15" fill="#f8f9fa"/>

  <!-- Chasis interior porta-módulos -->
  <rect x="24" y="24" width="152" height="272" rx="10" fill="none" stroke="#cfd4cb" stroke-width="0.8" opacity="0.6"/>

  <!-- Receptáculo tomacorriente en cy=160 -->
  <g class="outlet-module">
    <!-- Marco / módulo individual -->
    <rect x="30" y="120" width="140" height="80" rx="8" fill="#ffffff" stroke="#d5dad0" stroke-width="1"/>
    <!-- Cavidad rebajada suave del enchufe (receptáculo redondeado) -->
    <rect x="42" y="127" width="116" height="66" rx="14" fill="#eef1ea" stroke="#d5dad0" stroke-width="0.7"/>

    <!-- Ranura izquierda (Neutro / Espiga vertical con centro redondo universal) -->
    <g>
      <path d="M 71,148 v 24 a 3,3 0 0,0 6,0 v -24 a 3,3 0 0,0 -6,0 Z" fill="#111311"/>
      <circle cx="74" cy="160" r="5.2" fill="#111311"/>
      <rect x="73" y="151" width="2" height="18" fill="#755a29" opacity="0.65" rx="1"/>
    </g>

    <!-- Ranura derecha (Fase / Espiga vertical con centro redondo universal) -->
    <g>
      <path d="M 123,148 v 24 a 3,3 0 0,0 6,0 v -24 a 3,3 0 0,0 -6,0 Z" fill="#111311"/>
      <circle cx="126" cy="160" r="5.2" fill="#111311"/>
      <rect x="125" y="151" width="2" height="18" fill="#755a29" opacity="0.65" rx="1"/>
    </g>

    <!-- Puesta a tierra central (Arco semicircular) -->
    <g>
      <path d="M 95,177 h 10 v 5 a 5,5 0 0,1 -10,0 Z" fill="#111311"/>
      <circle cx="100" cy="177" r="4" fill="#111311"/>
      <circle cx="100" cy="177" r="2.2" fill="#755a29" opacity="0.65"/>
    </g>

    <!-- Marcado técnico discreto estampado -->
    <text x="100" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="4.5" font-weight="600" fill="#adb3a6" letter-spacing="0.8" opacity="0.6">16A 250V~</text>
  </g>
</svg>